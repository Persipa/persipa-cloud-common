stages:
  - prepare
  - deploy_maven

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      variables:
        BUILD_KIND: release
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^dev\/\d+\.\d+\.\d+-SNAPSHOT$/'
      variables:
        BUILD_KIND: snapshot
    - when: never

variables:
  CUSTOM_MAVEN_ARGS: ""
  GIT_DEPTH: "0"

cache:
  key: maven
  paths:
    - .m2/repository
    - .m2/wrapper/dists

prepare_build:
  stage: prepare
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  tags:
    - maven
  script:
    - |
      if [ "$BUILD_KIND" = "snapshot" ]; then
        BUILD_VERSION="${CI_COMMIT_BRANCH#dev/}"
      else
        BUILD_VERSION="$CI_COMMIT_TAG"

        git fetch --no-tags origin \
          "+refs/heads/main:refs/remotes/origin/main"

        if [ "$(git rev-parse refs/remotes/origin/main)" != "$CI_COMMIT_SHA" ]; then
          echo "正式版本 Tag 必须指向 main 分支的当前 HEAD。" >&2
          exit 1
        fi
      fi

      printf 'BUILD_VERSION=%s\n' "$BUILD_VERSION" > build.env
  artifacts:
    reports:
      dotenv: build.env

deploy_maven:
  stage: deploy_maven
  image: eclipse-temurin:17-jdk-noble
  tags:
    - maven
  needs:
    - job: prepare_build
      artifacts: true
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.m2"
    - cp "$FILE_MAVEN_SETTINGS_XML" "$CI_PROJECT_DIR/.m2/settings.xml"
  script:
    - ./mvnw $MAVEN_ARGS $CUSTOM_MAVEN_ARGS -Drevision="$BUILD_VERSION" clean deploy
