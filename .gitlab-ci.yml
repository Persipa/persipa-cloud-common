stages:
  - deploy_maven

variables:
  CUSTOM_MAVEN_ARGS: ""

cache:
  key: maven
  paths:
    - .m2/repository
    - .m2/wrapper/dists

deploy_maven:
  stage: deploy_maven
  image: eclipse-temurin:17-jdk-noble
  tags:
    - maven
  before_script:
    - mkdir -p $CI_PROJECT_DIR/.m2
    - cat $FILE_MAVEN_SETTINGS_XML > $CI_PROJECT_DIR/.m2/settings.xml
    - echo $MAVEN_ARGS
  script:
    - ./mvnw $MAVEN_ARGS $CUSTOM_MAVEN_ARGS clean deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
